name: CI

on:
  workflow_dispatch:
  push:
    branches: [iblrigv8]
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version-file: 'pyproject.toml'
          args: 'check --output-format=github'
      - run: 'ruff format --check --diff'
        
  tests:
    name: build (${{ matrix.python-version }}, ${{ matrix.os }})
    needs: ruff
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.10"]
    steps:
      - name: Checkout iblrig repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true
      - name: Install dependencies
        run: uv sync --no-default-groups --group test --group ci --extra project-extraction
      - name: Install required libraries (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libportaudio2 libegl1 libxkbcommon-x11-0
          version: 1.0
      - name: iblrig unit tests
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_OPENGL: software
      - name: coveralls.io
        uses: coverallsapp/github-action@v2
        with:
          flag-name: ${{ matrix.python-version }}, ${{ matrix.os }}
          parallel: true
          file: coverage.xml
          compare-ref: iblrigv8

  finish:
    needs: [ruff, tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true
